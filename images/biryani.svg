<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#faf5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d7c3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="155" rx="85" ry="20" fill="#D4A574" filter="url(#shadow)"/>
  
  <!-- Rice base with dimension -->
  <path d="M 115 155 Q 115 130 200 110 Q 285 130 285 155 L 285 180 Q 200 200 115 180 Z" fill="#C19A6B" stroke="#A67C52" stroke-width="1"/>
  <path d="M 115 155 Q 115 130 200 110 Q 285 130 285 155" fill="#E8D4B0" opacity="0.6"/>
  
  <!-- Rice grains texture -->
  <g opacity="0.7">
    <line x1="130" y1="140" x2="125" y2="150" stroke="#A0826D" stroke-width="1"/>
    <line x1="160" y1="125" x2="155" y2="135" stroke="#A0826D" stroke-width="1"/>
    <line x1="190" y1="120" x2="185" y2="130" stroke="#A0826D" stroke-width="1"/>
    <line x1="230" y1="125" x2="235" y2="135" stroke="#A0826D" stroke-width="1"/>
    <line x1="260" y1="140" x2="265" y2="150" stroke="#A0826D" stroke-width="1"/>
  </g>
  
  <!-- Chicken pieces -->
  <ellipse cx="150" cy="130" rx="12" ry="8" fill="#A0522D" transform="rotate(-25 150 130)"/>
  <ellipse cx="200" cy="120" rx="14" ry="9" fill="#8B4513" transform="rotate(20 200 120)"/>
  <ellipse cx="250" cy="135" rx="11" ry="7" fill="#A0522D" transform="rotate(-15 250 135)"/>
  
  <!-- Garnish - cilantro and mint -->
  <path d="M 140 145 Q 135 140 130 145" stroke="#228B22" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 260 150 Q 265 145 270 150" stroke="#228B22" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 175 155 Q 170 150 165 155" stroke="#2D5016" fill="none" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Spice highlights -->
  <circle cx="180" cy="145" r="2" fill="#FF6347" opacity="0.8"/>
  <circle cx="220" cy="140" r="1.5" fill="#FFD700" opacity="0.7"/>
  
  <!-- Text with shadow -->
  <text x="200" y="265" font-size="20" font-family="Georgia, serif" fill="#2b1810" text-anchor="middle" font-weight="bold">Chicken Biryani</text>
</svg>

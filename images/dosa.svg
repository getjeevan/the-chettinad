<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#faf5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d7c3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="dosaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D2B48C"/>
      <stop offset="50%" style="stop-color:#C19A6B"/>
      <stop offset="100%" style="stop-color:#A0826D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient2)"/>
  
  <!-- Dosa plate base -->
  <ellipse cx="200" cy="160" rx="95" ry="25" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="1" filter="url(#shadow2)"/>
  
  <!-- Main dosa crepe -->
  <path d="M 120 130 Q 110 160 140 190 Q 180 210 260 190 Q 290 160 280 130 Q 240 100 200 95 Q 160 100 120 130" 
        fill="url(#dosaGrad)" stroke="#8B7355" stroke-width="1.5"/>
  
  <!-- Dosa texture/crispiness -->
  <path d="M 130 135 Q 150 125 170 140" stroke="#9B8B7E" fill="none" stroke-width="0.8" opacity="0.6"/>
  <path d="M 200 100 Q 220 110 240 130" stroke="#9B8B7E" fill="none" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Potato filling -->
  <ellipse cx="200" cy="145" rx="60" ry="35" fill="#FFD700" opacity="0.8"/>
  <circle cx="170" cy="125" r="6" fill="#228B22" opacity="0.7"/>
  <circle cx="200" cy="120" r="5" fill="#228B22" opacity="0.7"/>
  <circle cx="230" cy="128" r="5" fill="#228B22" opacity="0.7"/>
  <circle cx="190" cy="160" r="4" fill="#228B22" opacity="0.7"/>
  <circle cx="220" cy="155" r="4" fill="#228B22" opacity="0.7"/>
  
  <!-- Chutney bowl -->
  <g transform="translate(90, 220)">
    <ellipse cx="0" cy="0" rx="25" ry="18" fill="#F5DEB3" stroke="#A0826D" stroke-width="1"/>
    <ellipse cx="0" cy="-8" rx="23" ry="12" fill="#F5F5DC"/>
    <circle cx="-5" cy="0" r="3" fill="#228B22"/>
    <circle cx="5" cy="2" r="2" fill="#228B22"/>
  </g>
  
  <!-- Sambar bowl -->
  <g transform="translate(310, 220)">
    <ellipse cx="0" cy="0" rx="25" ry="18" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    <ellipse cx="0" cy="-8" rx="23" ry="12" fill="#A0522D"/>
    <circle cx="-5" cy="-2" r="2" fill="#DC143C"/>
    <circle cx="5" cy="0" r="2" fill="#FFD700"/>
  </g>
  
  <text x="200" y="280" font-size="20" font-family="Georgia, serif" fill="#2b1810" text-anchor="middle" font-weight="bold">Masala Dosa</text>
</svg>

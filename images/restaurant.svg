<svg width="400" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C19A6B;stop-opacity:1" />
    </linearGradient>
    <filter id="tableShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background wall -->
  <rect width="400" height="240" fill="url(#wallGradient)"/>
  
  <!-- Floor -->
  <rect y="240" width="400" height="80" fill="url(#floorGradient)"/>
  
  <!-- Decorative wall elements -->
  <circle cx="80" cy="40" r="12" fill="#B74F2A" opacity="0.6"/>
  <circle cx="200" cy="35" r="15" fill="#B74F2A" opacity="0.6"/>
  <circle cx="320" cy="45" r="11" fill="#B74F2A" opacity="0.6"/>
  
  <!-- Left table -->
  <g filter="url(#tableShadow)">
    <rect x="30" y="100" width="70" height="70" rx="6" fill="#C19A6B" stroke="#8B4513" stroke-width="1.5"/>
    <!-- Table top shine -->
    <rect x="30" y="100" width="70" height="15" rx="6" fill="#D2B48C" opacity="0.5"/>
    <!-- Place settings - plates -->
    <circle cx="50" cy="125" r="12" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
    <circle cx="70" cy="140" r="11" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
    <!-- Utensils indicator -->
    <line x1="40" y1="125" x2="25" y2="125" stroke="#696969" stroke-width="1.5"/>
  </g>
  
  <!-- Center table -->
  <g filter="url(#tableShadow)">
    <rect x="165" y="90" width="70" height="70" rx="6" fill="#C19A6B" stroke="#8B4513" stroke-width="1.5"/>
    <rect x="165" y="90" width="70" height="15" rx="6" fill="#D2B48C" opacity="0.5"/>
    <circle cx="185" cy="120" r="12" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
    <circle cx="205" cy="130" r="12" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
    <!-- Centerpiece -->
    <circle cx="200" cy="105" r="6" fill="#228B22" opacity="0.7"/>
  </g>
  
  <!-- Right table -->
  <g filter="url(#tableShadow)">
    <rect x="300" y="100" width="70" height="70" rx="6" fill="#C19A6B" stroke="#8B4513" stroke-width="1.5"/>
    <rect x="300" y="100" width="70" height="15" rx="6" fill="#D2B48C" opacity="0.5"/>
    <circle cx="320" cy="130" r="12" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
    <circle cx="340" cy="125" r="11" fill="#FFE4B5" stroke="#A0826D" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Chairs -->
  <g opacity="0.7">
    <!-- Left chair back -->
    <rect x="35" y="60" width="18" height="30" rx="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    <!-- Center chair back -->
    <rect x="176" y="50" width="18" height="35" rx="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    <!-- Right chair back -->
    <rect x="315" y="60" width="18" height="30" rx="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  </g>
  
  <!-- Wall art/frames -->
  <g opacity="0.5">
    <rect x="20" y="20" width="40" height="35" stroke="#8B4513" stroke-width="2" fill="none" rx="2"/>
    <rect x="340" y="25" width="45" height="40" stroke="#8B4513" stroke-width="2" fill="none" rx="2"/>
  </g>
  
  <!-- Ceiling elements - wooden beams suggestion -->
  <line x1="0" y1="85" x2="400" y2="85" stroke="#D2A679" stroke-width="2" opacity="0.3"/>
  
  <!-- Text -->
  <text x="200" y="295" font-size="18" font-family="Georgia, serif" fill="#2b1810" text-anchor="middle" font-weight="bold">Warm Ambiance</text>
  <text x="200" y="315" font-size="13" font-family="Georgia, serif" fill="#6b584d" text-anchor="middle">Authentic dining experience</text>
</svg>

<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient3" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#faf5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d7c3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow3" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="curryGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient3)"/>
  
  <!-- Bowl shadow -->
  <ellipse cx="200" cy="185" rx="90" ry="20" fill="#8B7355" opacity="0.2"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="180" rx="90" ry="70" fill="#CD853F" stroke="#8B4513" stroke-width="2" filter="url(#shadow3)"/>
  
  <!-- Bowl rim highlight -->
  <ellipse cx="200" cy="115" rx="88" ry="15" fill="#DAA520" opacity="0.4"/>
  
  <!-- Curry liquid with gradient -->
  <ellipse cx="200" cy="160" rx="80" ry="55" fill="url(#curryGrad)"/>
  
  <!-- Lentil base texture -->
  <g opacity="0.5">
    <circle cx="170" cy="140" r="1.5" fill="#FFD700"/>
    <circle cx="200" cy="135" r="1" fill="#FFD700"/>
    <circle cx="230" cy="145" r="1.5" fill="#FFD700"/>
    <circle cx="185" cy="155" r="1" fill="#FFD700"/>
    <circle cx="220" cy="160" r="1.5" fill="#FFD700"/>
  </g>
  
  <!-- Tomato chunks -->
  <ellipse cx="160" cy="145" rx="10" ry="12" fill="#DC143C" transform="rotate(-20 160 145)"/>
  <ellipse cx="210" cy="135" rx="9" ry="11" fill="#E9573F" transform="rotate(25 210 135)"/>
  <ellipse cx="240" cy="155" rx="8" ry="10" fill="#DC143C" transform="rotate(-10 240 155)"/>
  
  <!-- Curry leaves garnish -->
  <g stroke="#228B22" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M 140 170 Q 135 165 130 170"/>
    <path d="M 135 180 Q 130 175 125 180"/>
    <path d="M 260 165 Q 265 160 270 165"/>
    <path d="M 265 175 Q 270 170 275 175"/>
  </g>
  
  <!-- Cilantro on top -->
  <g transform="translate(200, 120)">
    <path d="M 0 0 Q -8 -5 -10 -2" stroke="#228B22" fill="none" stroke-width="1.5" opacity="0.8"/>
    <path d="M 0 0 Q 8 -5 10 -2" stroke="#228B22" fill="none" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <text x="200" y="270" font-size="20" font-family="Georgia, serif" fill="#2b1810" text-anchor="middle" font-weight="bold">Thakkali Kuzhambu</text>
</svg>

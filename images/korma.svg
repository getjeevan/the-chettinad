<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient4" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#faf5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d7c3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow4" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="kormaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient4)"/>
  
  <!-- Bowl shadow -->
  <ellipse cx="200" cy="185" rx="90" ry="20" fill="#8B7355" opacity="0.2"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="180" rx="90" ry="70" fill="#F4A460" stroke="#8B4513" stroke-width="2" filter="url(#shadow4)"/>
  
  <!-- Bowl rim highlight -->
  <ellipse cx="200" cy="115" rx="88" ry="15" fill="#FFD700" opacity="0.3"/>
  
  <!-- Creamy curry sauce -->
  <ellipse cx="200" cy="160" rx="80" ry="55" fill="url(#kormaGrad)"/>
  
  <!-- Vegetable pieces - carrots (orange) -->
  <ellipse cx="160" cy="140" rx="9" ry="7" fill="#FF8C00" transform="rotate(-25 160 140)"/>
  <ellipse cx="180" cy="155" rx="8" ry="6" fill="#FFA500" transform="rotate(15 180 155)"/>
  
  <!-- Vegetable pieces - peas (green) -->
  <circle cx="170" cy="125" r="5" fill="#90EE90"/>
  <circle cx="210" cy="120" r="5" fill="#90EE90"/>
  <circle cx="240" cy="135" r="5" fill="#90EE90"/>
  
  <!-- Vegetable pieces - cauliflower (light) -->
  <ellipse cx="195" cy="150" rx="8" ry="6" fill="#FFFACD" stroke="#F0E68C" stroke-width="0.5"/>
  <ellipse cx="225" cy="160" rx="7" ry="5" fill="#FFFACD" stroke="#F0E68C" stroke-width="0.5"/>
  
  <!-- Vegetable pieces - red peppers -->
  <ellipse cx="215" cy="145" rx="6" ry="8" fill="#FF6347" transform="rotate(20 215 145)"/>
  
  <!-- Coconut/cream swirl accent -->
  <path d="M 150 170 Q 160 165 170 170" stroke="#FFFACD" fill="none" stroke-width="2" opacity="0.6"/>
  <path d="M 230 175 Q 240 170 250 175" stroke="#FFFACD" fill="none" stroke-width="2" opacity="0.6"/>
  
  <!-- Cilantro garnish -->
  <g stroke="#228B22" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M 130 165 Q 125 160 120 165"/>
    <path d="M 280 170 Q 285 165 290 170"/>
  </g>
  
  <text x="200" y="270" font-size="20" font-family="Georgia, serif" fill="#2b1810" text-anchor="middle" font-weight="bold">Vegetable Korma</text>
</svg>
